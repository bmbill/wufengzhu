# 每週自動更新《止觀初探・毗缽舍那》講次清單（老師還在講）
name: 更新毗缽舍那講次

on:
  schedule:
    - cron: "0 3 * * 0"   # 每週日 03:00 UTC（台灣週日上午 11 點）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 抓最新講次
        run: python tools/update_vip.py
      - name: 有變動就提交
        run: |
          if git diff --quiet lectures_vip.js; then
            echo "沒有新講次"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lectures_vip.js
            git commit -m "自動更新毗缽舍那講次清單"
            git push
          fi
