<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>燈燈相續</title>
<meta name="description" content="菩提道次第廣論的聽聞與實修：每天一段師父講解、聞法勝利、奢摩他上座、止觀初探，照戒定慧次第學習。">
<meta name="theme-color" content="#ece6ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="燈燈相續">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=Outfit:wght@300;500;700&display=swap">
<style>
/* Layout: one-column phone app over a fixed WebGL scene (a little 3D candle + drifting sparkles); bottom tab bar; dialogue strips with two characters; session overlay turns to night. Palette: dawn sky (lavender → apricot), plum ink, saffron/coral/mint accents. */
:root{
  --bg1:#ece6ff;
  --bg2:#ffe6d2;
  --ink:#2b2350;
  --mute:#6c6490;
  --faint:#a39cc0;
  --gold:#ffad1f;
  --coral:#ff7a59;
  --jade:#22b48d;
  --sky:#6c8cff;
  --rose:#ff6f91;
  --paper:#fffaf6;
  --card:rgba(255,255,255,.74);
  --card-2:rgba(255,255,255,.94);
  --line:rgba(43,35,80,.12);
  --night:#16123a;
  --moon:#f4eedf;
  --f-display:"LXGW WenKai TC","Noto Serif TC","PingFang TC",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-num:"Outfit","Noto Sans TC",system-ui,sans-serif;
  --r:22px;
  --shadow:0 8px 28px rgba(43,35,80,.09);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg1)}
html,body{margin:0;color:var(--ink)}
body{background:linear-gradient(175deg,var(--bg1) 0%,#f6e8f6 45%,var(--bg2) 100%) fixed;font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh}
img{max-width:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg1)}
#gl{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block;pointer-events:none}
#app{position:relative;z-index:1;max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(100px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:700;text-wrap:balance;margin:0}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--coral)}
:focus-visible{outline:2.5px solid var(--sky);outline-offset:2px;border-radius:8px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

.hero{min-height:36vh;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;padding-top:max(24px,env(safe-area-inset-top,0px));padding-bottom:10px;padding-right:34%}
.hero.wide{padding-right:0;min-height:26vh}
.hero .date{font-family:var(--f-num);letter-spacing:.12em;font-size:12px;color:var(--mute);text-transform:uppercase}
.hero h1{font-size:32px;line-height:1.18}
.hero .sub{color:var(--mute);font-size:14px}
.stagepill{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;margin-top:6px;padding:5px 12px 5px 5px;border-radius:999px;background:var(--card-2);box-shadow:var(--shadow);font-size:13px;font-weight:500;white-space:nowrap}
.stagepill b{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--gold);color:var(--ink);font-family:var(--f-num);font-size:12px}

.section{display:flex;flex-direction:column;gap:12px;margin-top:22px}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--mute);font-weight:500}
.card{background:var(--card);border:1px solid rgba(255,255,255,.8);border-radius:var(--r);padding:16px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;flex-direction:column;gap:10px;min-width:0;box-shadow:var(--shadow)}
.card.hot{background:linear-gradient(150deg,rgba(255,214,140,.55),rgba(255,255,255,.85) 60%);border-color:rgba(255,173,31,.5)}
.card.calm{border-color:rgba(34,180,141,.35)}
.card.warn{border-color:rgba(255,111,145,.45)}
.card h3{font-size:19px}
.card .meta{color:var(--mute);font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.task{display:grid;grid-template-columns:46px 1fr;gap:12px;align-items:start}
.check{width:46px;height:46px;border-radius:16px;border:2px dashed var(--faint);display:grid;place-items:center;font-size:20px;color:var(--faint);background:rgba(255,255,255,.6)}
.check.on{background:var(--jade);border:2px solid var(--jade);color:#fff;transform:rotate(-4deg)}
.check.half{border-color:var(--gold);color:var(--gold)}
.task .t{font-weight:700;font-size:16px}
.task .d{color:var(--mute);font-size:13px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1.5px solid var(--line);background:var(--card-2);border-radius:999px;padding:9px 16px;font-size:14px;line-height:1.2;transition:transform .15s ease,box-shadow .2s;text-decoration:none;color:var(--ink);display:inline-block}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--gold);border-color:var(--gold);font-weight:700;box-shadow:0 4px 0 #e08e00}
.btn.primary:active{box-shadow:0 1px 0 #e08e00;transform:translateY(3px)}
.btn.ghost{background:transparent}
.btn.small{padding:6px 12px;font-size:13px}
.btn[disabled]{opacity:.4}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;background:rgba(43,35,80,.06);color:var(--mute);white-space:nowrap;font-weight:500}
.tag.gold{background:rgba(255,173,31,.2);color:#9a5d00}
.tag.jade{background:rgba(34,180,141,.16);color:#0f7a5e}
.lect{display:flex;flex-direction:column;gap:4px}
.lect .n{font-family:var(--f-num);color:var(--coral);font-size:13px;letter-spacing:.06em;font-weight:500}
.lect .title{font-family:var(--f-display);font-size:21px;line-height:1.3}
.bar{height:7px;border-radius:99px;background:rgba(43,35,80,.08);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--coral),var(--gold));border-radius:99px}
.mini-note{font-size:13px;color:var(--mute)}
.tip{border-left:3px solid var(--gold);padding-left:10px;font-size:14px}
.quote{font-family:var(--f-display);font-size:16px}
.quote small{display:block;color:var(--mute);font-family:var(--f-body);font-size:12px;margin-top:2px}

/* 角色對話 */
.talk{display:flex;flex-direction:column;gap:10px}
.say{display:grid;grid-template-columns:62px minmax(0,1fr);gap:8px;align-items:end}
.say.r{grid-template-columns:minmax(0,1fr) 62px}
.say.r .ava{order:2}
.ava{width:62px;height:62px;display:block;position:relative}
.ava img,.ava svg{width:62px;height:62px;display:block;object-fit:contain;filter:drop-shadow(0 4px 6px rgba(43,35,80,.15))}
.ava .nm{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);font-size:10px;line-height:1.5;background:var(--ink);color:#fff;border-radius:999px;padding:0 7px;white-space:nowrap}
.bubble{position:relative;background:var(--card-2);border-radius:18px 18px 18px 6px;padding:10px 13px;font-size:14.5px;box-shadow:var(--shadow);min-width:0}
.say.r .bubble{border-radius:18px 18px 6px 18px;background:#fff1dd}
.bubble b{font-family:var(--f-display);font-size:16px;display:block;margin-bottom:2px}
.talk .btns{padding-left:70px}
.pop{animation:pop .4s cubic-bezier(.3,1.6,.6,1) both}
.pop:nth-child(2){animation-delay:.12s}.pop:nth-child(3){animation-delay:.24s}.pop:nth-child(4){animation-delay:.36s}
@keyframes pop{from{transform:translateY(6px) scale(.92);opacity:.3}to{transform:none;opacity:1}}

/* 聽講播放列 */
.lplayer{--pl-bg:rgba(255,255,255,.94);--pl-ink:var(--ink);--pl-sub:var(--mute);--pl-acc:var(--gold);--pl-acc-ink:var(--ink);--pl-chip:rgba(43,35,80,.07);--pl-line:rgba(255,255,255,.9)}
body[data-theme="lotus"] .lplayer{--pl-bg:#fff0f4;--pl-acc:#ff8fab;--pl-chip:rgba(255,143,171,.16);--pl-line:#ffd3df}
body[data-theme="ocean"] .lplayer{--pl-bg:#e9faf6;--pl-acc:#2bb3e6;--pl-acc-ink:#fff;--pl-chip:rgba(43,179,230,.14);--pl-line:#c4efe4}
body[data-theme="forest"] .lplayer{--pl-bg:#fff2e4;--pl-acc:#e8743b;--pl-acc-ink:#fff;--pl-chip:rgba(232,116,59,.14);--pl-line:#ffd9b8}
body[data-theme="elephant"] .lplayer{--pl-bg:#eef3ff;--pl-acc:#6c8cff;--pl-acc-ink:#fff;--pl-chip:rgba(108,140,255,.14);--pl-line:#d3ddff}
body[data-theme="moon"] .lplayer{--pl-bg:#221d52;--pl-ink:#f4eedf;--pl-sub:rgba(244,238,223,.65);--pl-acc:#ffd36b;--pl-chip:rgba(255,255,255,.1);--pl-line:rgba(255,211,107,.35)}
.lplayer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:6;width:min(536px,calc(100% - 24px));background:var(--pl-bg);color:var(--pl-ink);border:1.5px solid var(--pl-line);border-radius:24px;padding:10px 14px;box-shadow:0 12px 30px rgba(43,35,80,.18);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:flex;flex-direction:column;gap:4px}
.lp-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lp-t{display:flex;gap:8px;align-items:baseline;min-width:0}
.lp-n{color:var(--pl-acc);font-size:12px;font-weight:700;white-space:nowrap;filter:saturate(1.2) brightness(.85)}
body[data-theme="moon"] .lp-n{filter:none}
.lp-title{font-family:var(--f-display);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lp-x{background:none;border:0;color:var(--pl-sub);font-size:14px;padding:2px 4px}
#lpSeek{width:100%;accent-color:var(--pl-acc);height:18px;margin:0}
.lp-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.lp-time{font-size:12px;color:var(--pl-sub);white-space:nowrap}
.lp-ctl{display:flex;align-items:center;gap:8px}
.lp-ctl button{width:42px;height:42px;padding:0;border:0;border-radius:50%;display:grid;place-items:center;background:var(--pl-chip);color:var(--pl-ink);font-size:12px;font-weight:700;letter-spacing:-.02em}
.lp-ctl .lp-ico{color:var(--pl-sub)}
.lp-ctl button[aria-pressed="true"]{background:var(--pl-acc);color:var(--pl-acc-ink)}
.lp-ctl .lp-play{background:var(--pl-acc);color:var(--pl-acc-ink);font-size:15px}
.lplayer .btn.primary{background:var(--pl-acc);border-color:var(--pl-acc);color:var(--pl-acc-ink);box-shadow:none}
body.playing .toast{bottom:calc(210px + env(safe-area-inset-bottom,0px))}
body.playing #app{padding-bottom:calc(200px + env(safe-area-inset-bottom,0px))}
body.in-session .lplayer{visibility:hidden}
/* 研討式聽講 */
.lp-seg{font-size:11px;color:var(--pl-sub);white-space:nowrap;flex:none}
.lp-study{display:flex;flex-direction:column;gap:6px;padding:6px 0 4px;border-top:1px solid var(--pl-line)}
.lp-study textarea{min-height:52px;font-size:14px}
.lp-q{font-weight:700;font-size:14px}
.passes{display:flex;gap:6px;flex-wrap:wrap}
.pd{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--mute);padding:3px 10px 3px 3px;border-radius:999px;background:rgba(43,35,80,.05)}
.pd b{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:rgba(43,35,80,.1);font-family:var(--f-num);font-size:11px}
.pd.on{color:var(--ink)}.pd.on b{background:var(--jade);color:#fff}
.pd.cur{background:rgba(255,173,31,.22);color:var(--ink);font-weight:700}.pd.cur b{background:var(--gold)}
.beadrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.beads{display:flex;align-items:center;gap:4px;position:relative;padding:2px 0}
.beads::before{content:"";position:absolute;left:0;right:0;top:50%;height:1.5px;background:rgba(43,35,80,.15)}
.beads i{position:relative;width:9px;height:9px;border-radius:50%;background:#fff;border:1.5px solid rgba(43,35,80,.25)}
.beads i.on{width:15px;height:15px;background:var(--gold);border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,173,31,.25)}
.lk-inline{background:none;border:0;padding:0;color:var(--coral);font:inherit;text-decoration:underline;cursor:pointer}
.note-b{margin-left:6px;font-size:11px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:0 6px;color:var(--mute);vertical-align:1px}
/* 戒：每日聽聞 */
.root{font-family:var(--f-display);font-size:17px;line-height:1.75;white-space:pre-line;background:rgba(255,173,31,.1);border-radius:14px;padding:10px 12px;margin:4px 0 0}
.lt-p{font-size:15px;line-height:1.8;margin:8px 0}
.partline{display:flex;gap:4px;flex-wrap:wrap}
.partline span{font-size:11px;padding:2px 8px;border-radius:999px;background:rgba(43,35,80,.06);color:var(--mute)}
.partline span.on{background:var(--ink);color:#fff}
.stamps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stamp{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:3px;font:inherit;color:var(--mute)}
.stamp .seal{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;text-align:center;font-family:var(--f-display);font-size:12px;line-height:1.15;padding:6px;border:2px dashed rgba(43,35,80,.2);color:var(--faint)}
.stamp.on .seal{border:3px double #d4483b;color:#c23a2e;background:rgba(212,72,59,.06);transform:rotate(-8deg);font-weight:700}
.stamp small{font-size:10px}
.stamp.big{margin:0 auto}.stamp.big .seal{width:96px;height:96px;font-size:18px}
.tri{gap:14px}
.tri-row{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:start}
.tri-k{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-display);font-size:20px;background:var(--ink);color:#fff}
body.sub:not(.in-session) #gl{opacity:0;transition:opacity .4s}
/* 戒：主題、目標、模式、自選 */
.lr-topic{font-family:var(--f-display);font-size:20px;margin:4px 0 2px;line-height:1.35}
.goal{font-size:13.5px;line-height:1.6;background:rgba(34,180,141,.09);border-left:3px solid rgba(34,180,141,.55);border-radius:10px;padding:7px 10px;margin:8px 0 0;color:var(--ink)}
.goal b{display:block;font-size:11px;letter-spacing:.08em;color:#0f7a5e;margin-bottom:1px}
.lrmode{margin:6px 0 2px}
.flow{margin:10px 0 4px;padding-left:22px;font-size:14px;line-height:1.6}.flow li{margin:3px 0}.flow b{margin-right:6px}
.goalchk{border:0;padding:0;margin:10px 0 4px;display:grid;gap:8px}
.goalchk label{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start;font-size:14px;line-height:1.55;background:var(--card-2);border-radius:12px;padding:8px 10px}
.goalchk input{width:20px;height:20px;margin:2px 0 0;accent-color:#22b48d}
.goalchk b{display:block;font-size:12px;color:#0f7a5e}
.pick-list{max-height:58vh;overflow:auto;margin:8px -4px;padding:0 4px}
.pick-cat{border-bottom:1px solid rgba(43,35,80,.08)}
.pick-cat summary{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:10px 2px;cursor:pointer}
.pick-units{display:grid;gap:4px;padding:0 0 10px}
.pick-u{display:grid;grid-template-columns:30px 1fr;gap:8px;text-align:left;border:0;background:var(--card-2);border-radius:10px;padding:8px;font:inherit;color:var(--ink);cursor:pointer}
.pick-u.cur{outline:2px solid var(--coral)}
.pick-u.ok .pk-m{color:#0f7a5e;font-weight:700}
.pk-m{font-family:var(--f-num);color:var(--mute);text-align:center}
.pk-t{font-size:14px;line-height:1.45}.pk-t small{display:block;color:var(--mute);font-size:11px}
/* 首頁三大塊 */
.tiles{gap:16px}
.tile{position:relative;display:grid;grid-template-columns:58px minmax(0,1fr) 16px;gap:12px;align-items:center;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid rgba(255,255,255,.8);border-radius:var(--r);padding:16px 14px;box-shadow:var(--shadow);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);margin-top:14px;transition:transform .15s}
.tile:active{transform:scale(.98)}
.tile-k{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;font-family:var(--f-display);font-size:30px;font-weight:700;color:#fff}
.tile-jie .tile-k{background:linear-gradient(150deg,#ff9a6b,#ff7a59)}
.tile-ding .tile-k{background:linear-gradient(150deg,#ffc24d,#ffad1f)}
.tile-hui .tile-k{background:linear-gradient(150deg,#8ea6ff,#6c8cff)}
.tile-b{display:flex;flex-direction:column;gap:3px;min-width:0}
.tile-eb{font-size:11px;letter-spacing:.1em;color:var(--mute)}
.tile-t{font-family:var(--f-display);font-size:22px;font-weight:700;line-height:1.2}
.tile-sub{font-size:13px;color:var(--mute);padding-right:44px}
.tchips{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0 2px}
.tchip{font-size:12px;padding:2px 9px;border-radius:999px;background:rgba(43,35,80,.06);color:var(--mute);white-space:nowrap}
.tchip.ok{background:rgba(34,180,141,.16);color:#0f7a5e;font-weight:700}
.tchip.warn{background:rgba(255,111,145,.16);color:#c2335a;font-weight:700}
.tile-pct{font-size:11px;color:var(--mute)}
.tile-go{font-size:26px;color:var(--faint);line-height:1}
.tile .sticker.tr{top:-30px;right:4px;width:60px;height:60px}
.subhead .back{display:inline-block;align-self:flex-start;text-decoration:none;color:var(--ink);background:var(--card-2);border-radius:999px;padding:5px 12px;font-size:13px;box-shadow:var(--shadow);margin-bottom:6px}
/* 主題收藏 */
.oilbar{display:flex;align-items:center;gap:12px}
.oil-drop{width:44px;height:44px;flex:none}
.oil-v{font-family:var(--f-num);font-size:30px;font-weight:500;line-height:1}
.themes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.th{border:2px solid transparent;background:rgba(255,255,255,.7);border-radius:18px;padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;min-width:0}
.th .pv{width:100%;height:52px;display:flex;justify-content:center;gap:2px}
.th .pv img,.th .pv svg{width:50px;height:50px;object-fit:contain}
.th small.who{color:var(--ink);font-size:11px}
.th b{font-family:var(--f-display);font-size:15px}
.th small{font-size:11px;color:var(--mute)}
.th.on{border-color:var(--gold);background:#fff}
.th.lock .pv{filter:grayscale(1) opacity(.45)}
.unlock-art{position:relative;height:96px}
.unlock-art .sticker{width:96px;height:96px}
.sheet .panel .unlock-art .sticker.tl{top:0;left:14%;right:auto}
.sheet .panel .unlock-art .sticker.tr{top:0;right:14%}
/* 角色貼圖（像 LINE 主題，疊在卡片邊角） */
.card{position:relative}
.sticker{position:absolute;width:70px;height:70px;pointer-events:none;z-index:2}
.sticker .bob{display:block;width:100%;height:100%;animation:bob 3.2s ease-in-out infinite}
.sticker img,.sticker svg{width:100%;height:100%;display:block;object-fit:contain;filter:drop-shadow(0 5px 6px rgba(43,35,80,.2))}
.sticker.tr{top:-34px;right:-6px;transform:rotate(7deg)}
.sticker.tl{top:-34px;left:-8px;transform:rotate(-8deg)}
.sticker.br{bottom:-20px;right:-8px;transform:rotate(-6deg)}

  else if(lp&&gap>=4&&!practiced(d)){out.push({tone:"warn",q:["sad","好幾天沒坐了……是不是前功盡棄了？"],zm:"gentle",title:`已經 ${gap-1} 天沒上座了`,body:"中斷很正常，不用補。先「回溫三天」：每天只坐 3 分鐘，聽講進度照常，不會被清掉。",acts:[["開始回溫三天","warm"],["今天先做保底一分鐘","mini"]]})}
  else if(lp&&gap>=2&&!practiced(d)){out.push({tone:"calm",q:["confused","昨天沒坐到……今天要坐兩次補回來嗎？"],zm:"gentle",title:"昨天沒坐到？",body:"不用補兩座。今天照常坐一座就好。真的很忙，就做「保底一分鐘」，也算有練。",acts:[["保底一分鐘","mini"]]})}
  const cps=CPS.filter(cp=>cpStatus(cp)==="due");
  if(cps.length) out.push({tone:"hot",q:["think","檢核？是要考試嗎？"],zm:"happy",title:`檢核點到了：${cps[0].name}`,body:"花兩分鐘勾一勾，看看哪裡需要加強。沒過也沒關係，會告訴你怎麼補。",acts:[["去檢核","go-check"]]});
  if(!S.vipOn&&!S.vipOffered&&heardAll(S,INTRO)) out.push({tone:"hot",q:["happy","入門線聽完了！"],zm:"wow",title:"可以開啟第二章：毗缽舍那",body:"奢摩他入門線聽完了。第二章會多一張毗缽舍那的聽講卡，和每天選做的「觀察修 5 分鐘」；上座照常。",acts:[["開啟第二章","vip-on"],["之後再說","vip-later"]]});
  const a=canAdvance();
  if(a.ok&&!snoozed("adv")&&!wl) out.push({tone:"hot",q:["happy","最近每天都有坐耶！"],zm:"cheer",title:`可以往第 ${a.next.n} 階「${a.next.name}」了`,body:`最近練習很穩，需要的講次也聽了。下一階座時 ${a.next.min} 分鐘：${a.next.focus}`,acts:[["升一階","advance"],["再穩一週","snooze-adv"]]});
  else if(!wl&&S.stage<9&&a.steady&&a.longEnough&&(a.miss.length||a.needObj)&&!snoozed("adv-info")){
    const parts=[];if(a.miss.length)parts.push(`先聽第 ${a.miss.join("、")} 講`);if(a.needObj)parts.push("到「調整」選定所緣");
    out.push({tone:"calm",q:["think","我可以往上一階了嗎？"],zm:"think",title:"練習很穩，下一階快到了",body:`往第 ${a.next.n} 階「${a.next.name}」之前，還要${parts.join("，再")}。`,acts:[["知道了","snooze-adv-info"]]});
  }
  const c=consistency();
  if(!wl&&S.stage>1&&c.total>=5&&c.done<=2&&daysBetween(S.stageSince,t)>=7&&!snoozed("down")&&!(gap>=4))
    out.push({tone:"warn",q:["sleepy","最近好難坐下來……"],zm:"gentle",title:"最近比較難坐下來",body:`過去 ${c.total} 天坐了 ${c.done} 天。要不要先回到上一階，座時短一點，等穩了再往上？`,acts:[["回到上一階","down"],["先不用","snooze-down"]]});
  const w=weekNo(t);
  if(w>=3&&!snoozed("pace")){
    const last=[w-1,w-2,w-3].map(heardInWeek);const avg=last.reduce((x,y)=>x+y,0)/3;
    if(S.pace>1&&avg<S.pace*0.5) out.push({tone:"calm",q:["confused","聽講一直跟不上……"],zm:"gentle",title:"聽講的速度要不要放慢？",body:`最近三週平均每週聽 ${avg.toFixed(1)} 講，目標是 ${S.pace} 講。放慢一點也很好，穩定比快重要。`,acts:[[`改成每週 ${S.pace-1} 講`,"pace-down"],["維持","snooze-pace"]]});
    else if(S.pace<3&&last.every(x=>x>=S.pace+1)&&c.done>=5) out.push({tone:"calm",q:["happy","我最近聽了好多講！"],zm:"happy",title:"你最近聽得比目標多",body:`連續三週都超過每週 ${S.pace} 講。要不要把目標調高一點？不調也完全可以。`,acts:[[`改成每週 ${S.pace+1} 講`,"pace-up"],["維持","snooze-pace"]]});
  }
  if(w>=1&&!out.length){const lw=heardInWeek(w-1);if(lw<S.pace)out.push({tone:"calm",q:["confused","上週沒聽完，要補嗎？"],zm:"gentle",title:`上週聽了 ${lw}/${S.pace} 講`,body:"不用補。這週照順序接著聽就好，進度表是排隊制，不會因為漏聽而越欠越多。",acts:[]})}
  return out;
}

let toastT;function toast(m){let el=document.querySelector(".toast");if(!el){el=document.createElement("div");el.className="toast";el.setAttribute("role","status");document.body.appendChild(el)}el.textContent=m;clearTimeout(toastT);toastT=setTimeout(()=>el.remove(),2200)}
document.addEventListener("click",e=>{

function restoreFrom(txt){try{const o=JSON.parse(txt);if(!o.state)throw 0;S=Object.assign(blank(),o.state);DAYS=o.days||{};persist();render();toast("已還原")}catch(e){toast("格式不對，請用本 App 產生的備份")}}
function doDownload(){

  const blob=new Blob([JSON.stringify({app:"燈燈相續",exported:new Date().toISOString(),state:S,days:DAYS},null,1)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`燈燈相續備份-${today()}.json`;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);render();toast("備份檔已下載");
}

const Audio_={ac:null,unlock(){try{if(!this.ac)this.ac=new (window.AudioContext||window.webkitAudioContext)();if(this.ac.state==="suspended")this.ac.resume()}catch(e){}},
  bell(soft){try{this.unlock();const ac=this.ac;const t=ac.currentTime;[[196,1],[392.5,.55],[588,.3],[1176,.12]].forEach(([f,g])=>{const o=ac.createOscillator(),gn=ac.createGain();o.type="sine";o.frequency.value=f;gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime((soft?.12:.28)*g,t+.015);gn.gain.exponentialRampToValueAtTime(.0001,t+5);o.connect(gn).connect(ac.destination);o.start(t);o.stop(t+5.1)})}catch(e){}}};
/* 語音：優先播預錄的 Azure 曉曉 mp3（voice/map.js，破音字已用拼音校正）；沒有錄音的句子才用手機內建語音。 */
const player=new Audio();player.preload="auto";
const Voice={web:("speechSynthesis" in window),cur:null,mode:null,
  map(){return window.VOICE_MAP||null},
  describe(){const m=this.map();if(m)return `使用預錄的「${(window.VOICE_INFO&&VOICE_INFO.name)||"曉曉"}」語音，破音字已校正（共 ${Object.keys(m).length} 句）。`;if(this.web)return "錄音檔還沒載入，暫時用手機內建的中文語音。";return "這個瀏覽器不支援語音，引導會用文字和鈴聲。"},
  unlock(){try{player.src="voice/silence.mp3";const p=player.play();if(p&&p.catch)p.catch(()=>{})}catch(e){}},
  pickWeb(){if(!this.web)return null;const vs=speechSynthesis.getVoices();return vs.find(v=>/zh[-_]TW/i.test(v.lang))||vs.find(v=>/zh[-_]HK/i.test(v.lang))||vs.find(v=>/^zh/i.test(v.lang))||null},
  speak(text){
    showCap(text);
    if(!S.voice) return timed(text);
    const m=this.map();
    if(m&&m[text]) return this.clip(m[text],text);
    return this.webSay(text);
  },
  clip(file,text){return new Promise(res=>{let fin=false;const end=()=>{if(fin)return;fin=true;clearTimeout(g);player.onended=player.onerror=null;this.cur=null;res()};
    player.onended=end;player.onerror=()=>{if(fin)return;fin=true;clearTimeout(g);this.cur=null;res(this.webSay(text))};
    this.cur=end;this.mode="clip";player.src="voice/"+file;player.playbackRate=S.rate/0.9;try{player.preservesPitch=true;player.webkitPreservesPitch=true}catch(e){}
    const g=setTimeout(end,90000);const p=player.play();if(p&&p.catch)p.catch(()=>{if(fin)return;fin=true;clearTimeout(g);this.cur=null;res(this.webSay(text))})})},
  webSay(text){if(!this.web)return timed(text);this.mode="web";return new Promise(res=>{try{const u=new SpeechSynthesisUtterance(text);const v=this.pickWeb();if(v)u.voice=v;u.lang=v?v.lang:"zh-TW";u.rate=S.rate;let fin=false;const end=()=>{if(!fin){fin=true;clearTimeout(g);this.cur=null;res()}};u.onend=end;u.onerror=end;const g=setTimeout(end,text.length*420+4000);this.cur=end;speechSynthesis.speak(u)}catch(e){res(timed(text))}})},
  stop(){try{player.pause()}catch(e){}try{if(this.web)speechSynthesis.cancel()}catch(e){}const c=this.cur;this.cur=null;c&&c()},
  pause(){try{if(this.mode==="clip")player.pause();else if(this.web)speechSynthesis.pause()}catch(e){}},
  resume(){try{if(this.mode==="clip"&&this.cur)player.play().catch(()=>{});else if(this.web)speechSynthesis.resume()}catch(e){}}
};
if(Voice.web){try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices()}catch(e){}}
/* 列出所有引導詞（產生錄音用）：在瀏覽器主控台執行 allVoiceLines() */
function allVoiceLines(){
  const set=new Set([...MERITS,...TEST_SAY,CHECK_SAY,VIP_INTRO,VIP_MID,VIP_END,...PRE_SAY,SEG_SAY,END_SAY]);const keep={stage:S.stage,obj:S.obj};
  const grab=steps=>steps.forEach(s=>(s.fns||[]).forEach(f=>{if(f.text)set.add(f.text)}));
  ["mini","alert","night","vip"].forEach(k=>grab(Session.build(k)));
  VSTAGES.forEach(v=>v.prompts.forEach(x=>set.add(x)));
  for(let n=1;n<=9;n++)for(const o of [null,"breath","buddha"]){S.stage=n;S.obj=o;grab(Session.build("sit",MERITS[0]))}
  S.stage=keep.stage;S.obj=keep.obj;return [...set];
}

    try{if(navigator.wakeLock)this.lock=await navigator.wakeLock.request("screen")}catch(e){}
    document.body.classList.add("in-session");Scene.setMode("session");Scene.flicker(kind==="sit"?0.6:0.4);
    let i=0;
    for(const s of steps){if(this.abortF)break;this.skipF=false;this.setStep(s,i++,steps.length);await s.run()}
    const aborted=this.abortF;this.unmount();
    if(kind==="sit"){const m=Math.max(1,Math.round(this.silent/60000));if(!aborted||this.silent>=60000)openLog({m})}
    else if(kind==="vip"){if(!aborted||this.silent>=60000)openVipNote()}
    else if(!aborted){const t=today();const d=ensureDay(t);if(kind==="mini")d.min=true;if(kind==="alert")d.breath=true;if(kind==="night")d.night=true;persist(t);render();toast(kind==="mini"?"保底完成，燈油 +1":"完成，燈油 +1")}
  },
  build(kind,pickMerit){
    const st=stage();
    const step=(label,fns)=>({label,fns,run:async()=>{for(const f of fns){if(this.abortF||this.skipF)break;await f()}}});
    const sp=t=>Object.assign(()=>Voice.speak(t),{text:t});const w=(ms,o)=>()=>this.wait(ms,o);
    if(kind==="mini") return [
      step("保底一分鐘",[sp("只要一分鐘。坐直，眼睛微微張開。在心裡數十次呼吸，數完就安靜坐著。"),()=>{Audio_.bell(true)},w(60000,{clock:true,silent:true,count:false}),()=>{Audio_.bell()},sp("很好。今天也點了一盞燈。")])];
    if(kind==="alert") return [
      step("停一下",[sp("停一下。肩膀放下來，下巴放鬆。跟著光，慢慢吸，再慢慢呼，呼得比吸更長。")]),
      step("跟著光呼吸",[()=>this.pace(6)]),
      step("回來",[sp("好。帶著這份安靜，回到你正在做的事。")])];
    if(kind==="night") return [
      step("回顧",[sp("今天辛苦了。我們用三分鐘回顧今天。"),sp("第一，想一想今天的身體、語言、念頭，有沒有傷害到別人，或者違犯了自己受的戒。"),w(20000,{clock:true})]),
      step("懺悔",[sp("如果有，誠心懺悔：知道這是錯的，真心後悔，決定以後不再這樣做，並且依靠三寶。"),w(15000,{clock:true})]),
      step("隨喜",[sp("第二，想一件今天做得好的事。隨喜自己，也隨喜別人。"),w(15000,{clock:true})]),
      step("發願",[sp("第三，為明天發一個小願。例如：明天我要準時上座。"),w(8000,{clock:true})]),
      step("迴向",[sp(DEDICATE),()=>{Audio_.bell(true)}])];
    if(kind==="vip"){const vs=vstage();const pr=vs.prompts[Math.floor(Math.random()*vs.prompts.length)];
      return [
      step("皈依發心",[sp("一起皈依發心。"),sp(REFUGE),w(1500)]),
      step("調身調息",[sp(BODY_BRIEF),sp(BREATH_SAY),w(10000)]),
      step("觀察修",[sp(VIP_INTRO),()=>{Audio_.bell(true)},sp(pr),w(120000,{clock:true,silent:true}),()=>{if(this.abortF||this.skipF)return;Audio_.bell(true)},sp(VIP_MID),w(90000,{clock:true,silent:true})]),
      step("回來・迴向",[()=>{this.skipF=false;Audio_.bell()},sp(VIP_END),sp(DEDICATE)])];}
    const total=sitMin()*60000;
    const merit=pickMerit||MERITS[Math.floor(Math.random()*MERITS.length)];
    const mainParts=(st.n>=4&&S.obj)?[OBJ_MAIN[S.obj],...(st.main&&st.n>=5?[st.main]:[])]:[st.main||OBJ_MAIN.breath];
    const bodySteps=st.body==="full"?BODY_FULL.flatMap(t=>[sp(t),w(2500)]):[sp(BODY_BRIEF)];
    return [
      step("皈依發心",[sp("我們開始。先找到舒服的坐姿。"),sp("一起皈依發心。"),sp(REFUGE),w(2000)]),
      step("想一想功德",[sp(merit),w(2000)]),
      step("調身",bodySteps),
      step("調息",[sp(BREATH_SAY),w(15000,{clock:false})]),
      step("數息二十一次",[sp(COUNT_SAY),()=>{Audio_.bell(true)},async()=>{const t0=this.silent;await this.wait(Math.min(150000,Math.max(60000,total*0.6)),{clock:true,silent:true,count:true});this.countUsed=this.silent-t0}]),
      step("安住",[()=>{this.skipF=false;Audio_.bell(true)},...mainParts.map(sp),Object.assign(()=>{},{text:st.check?CHECK_SAY:null}),async()=>{const left=Math.max(60000,total-(this.countUsed||0));if(st.check&&left>=120000){await this.wait(left/2,{clock:true,silent:true,steady:true});if(this.abortF||this.skipF)return;Audio_.bell(true);await Voice.speak(CHECK_SAY);await this.wait(left/2,{clock:true,silent:true,steady:true})}else await this.wait(left,{clock:true,silent:true,steady:true})}]),
      step("下座・迴向",[()=>{this.skipF=false;Audio_.bell()},w(3000),sp("慢慢回來。動一動手指，輕輕張開眼睛。"),sp(DEDICATE)])];
  },
  wait(ms,o={}){return new Promise(res=>{let left=ms;let last=performance.now();const clk=document.getElementById("clock");const cnt=document.getElementById("countBtn");
    if(cnt)cnt.hidden=!o.count;
    if(o.steady)Scene.flicker(0);
    const tick=()=>{const now=performance.now();const dt=now-last;last=now;
      if(this.abortF||this.skipF){done();return}
      if(!this.paused){left-=dt;if(o.silent)this.silent+=dt}
      if(clk&&o.clock){const s=Math.max(0,Math.ceil(left/1000));clk.textContent=`${Math.floor(s/60)}:${pad(s%60)}`}
      if(left<=0){done();return}
      this._raf=requestAnimationFrame(tick)};
    const done=()=>{if(clk&&o.clock)clk.textContent="";if(cnt)cnt.hidden=true;if(o.steady)Scene.flicker(.4);res()};
    this._raf=requestAnimationFrame(tick)})},
  async pace(cycles){
    const cap=document.getElementById("cap");
    for(let c=0;c<cycles;c++){
      for(const [ph,dur,txt] of [["in",4000,"吸氣……"],["out",6000,"慢慢呼氣……"]]){
        if(this.abortF||this.skipF)return;if(cap)cap.textContent=txt;Scene.breathe(ph,dur);await this.wait(dur,{clock:false})
      }
    }
    Scene.breathe(null);
  },
  mount(kind,n){const L=document.getElementById("layer");
    const title={sit:"上座・語音引導",mini:"保底一分鐘",alert:"呼吸警報",night:"睡前反省"}[kind];
    L.innerHTML=`<div class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-step">
      <div class="top"><span class="label">${title}</span><button class="btn small ghost" id="ovEnd">結束</button></div>
      <div class="center"><div class="prog" id="prog">${Array.from({length:n},()=>"<i></i>").join("")}</div><div class="step" id="ov-step"></div><div class="clock num" id="clock" aria-live="off"></div><p class="cap" id="cap" aria-live="polite"></p>
      <div class="controls"><button class="btn primary" id="countBtn" hidden>數完了</button><button class="btn" id="ovPause">暫停</button><button class="btn ghost" id="ovSkip">跳過這段</button></div></div></div>`;
    document.getElementById("ovEnd").onclick=()=>{this.abortF=true;Voice.stop()};
    document.getElementById("ovSkip").onclick=()=>{this.skipF=true;Voice.stop()};
    document.getElementById("countBtn").onclick=()=>{this.skipF=true};
    const pb=document.getElementById("ovPause");pb.onclick=()=>{this.paused=!this.paused;pb.textContent=this.paused?"繼續":"暫停";if(this.paused)Voice.pause();else Voice.resume()};
  },
  setStep(s,i,n){const el=document.getElementById("ov-step");if(el&&s.label)el.textContent=s.label;document.querySelectorAll("#prog i").forEach((x,j)=>x.classList.toggle("on",j<=i))},
  unmount(){cancelAnimationFrame(this._raf);document.body.classList.remove("in-session");Voice.stop();document.getElementById("layer").innerHTML="";this.on=false;try{this.lock&&this.lock.release()}catch(e){}this.lock=null;Scene.breathe(null);Scene.flicker(1);Scene.setMode(route==="progress"?"lamps":SUBS.includes(route)?"none":"orb")}
};
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&Session.on){Session.abortF=true}});

/* ================= Three.js 場景：一根小蠟燭＋飄浮光點＋153 盞燈 ================= */
const Scene=(()=>{
  const api={setMode(){},setLamps(){},breathe(){},flicker(){}};
  if(!window.THREE)return api;
  const cv=document.getElementById("gl");let R;
  try{R=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true,powerPreference:"low-power"})}catch(e){return api}
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  R.setPixelRatio(Math.min(2,devicePixelRatio||1));
  const NIGHT=new THREE.Color(0x16123a);let clearA=0;R.setClearColor(NIGHT,0);
  const scene=new THREE.Scene();
  const cam=new THREE.PerspectiveCamera(35,1,.1,100);cam.position.set(0,0,10);
  scene.add(new THREE.HemisphereLight(0xffffff,0xc9bdf5,.95));
  const dl=new THREE.DirectionalLight(0xffd9a8,.55);dl.position.set(3,4,5);scene.add(dl);

  /* 蠟燭 */
  const candle=new THREE.Group();scene.add(candle);
  const lam=c=>new THREE.MeshLambertMaterial({color:c});
  const body=new THREE.Mesh(new THREE.CylinderGeometry(.42,.45,1.35,40),lam(0xfff3e4));candle.add(body);
  const rim=new THREE.Mesh(new THREE.CylinderGeometry(.43,.43,.07,40),lam(0xffe8d2));rim.position.y=.68;candle.add(rim);
  [[.3,.26],[1.7,.42],[3.0,.2],[4.4,.34],[5.5,.22]].forEach(([a,l])=>{const d=new THREE.Mesh(new THREE.SphereGeometry(.075,14,10),lam(0xfff6ea));d.scale.set(1,l/.075*.5,1);d.position.set(Math.cos(a)*.42,.68-l*.5,Math.sin(a)*.42);candle.add(d)});
  const band=new THREE.Mesh(new THREE.CylinderGeometry(.455,.465,.13,40),lam(0xff7a59));band.position.y=-.22;candle.add(band);
  const band2=new THREE.Mesh(new THREE.CylinderGeometry(.46,.468,.04,40),lam(0xffad1f));band2.position.y=-.1;candle.add(band2);
  const plate=new THREE.Mesh(new THREE.CylinderGeometry(.78,.66,.1,40),lam(0xffc46b));plate.position.y=-.72;candle.add(plate);
  const wick=new THREE.Mesh(new THREE.CylinderGeometry(.018,.018,.16,8),lam(0x3a2f63));wick.position.y=.78;candle.add(wick);
  const FU={uTime:{value:0},uFlick:{value:1},uA:{value:1}};
  const flame=new THREE.Mesh(new THREE.PlaneGeometry(.62,1.05),new THREE.ShaderMaterial({uniforms:FU,transparent:true,depthWrite:false,
    vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
    fragmentShader:`uniform float uTime,uFlick,uA;varying vec2 vUv;
    void main(){vec2 p=vUv*2.-1.;float t=(p.y+.78)/1.72;
      p.x-=sin(uTime*3.2+t*3.)*.09*uFlick*t*t+sin(uTime*7.1)*.02*uFlick*t;
      float w=1.75*sqrt(max(t,0.))*pow(max(1.-t,0.),1.25)*.62;
      float e=abs(p.x)/max(w,1e-3);
      float a=smoothstep(1.,.72,e)*step(0.,t)*step(t,1.);
      vec3 c=mix(vec3(1.,.42,.16),vec3(1.,.74,.2),smoothstep(0.,.7,1.-e));
      c=mix(c,vec3(1.,.97,.86),smoothstep(.62,0.,e)*smoothstep(.85,.15,t));
      c=mix(c,vec3(.45,.58,1.),smoothstep(.16,0.,t)*smoothstep(.6,0.,e)*.7);
      gl_FragColor=vec4(c,a*uA);}`}));
  flame.position.y=1.24;candle.add(flame);
  const hc=document.createElement("canvas");hc.width=hc.height=128;const hx=hc.getContext("2d");const gr=hx.createRadialGradient(64,64,0,64,64,64);
  gr.addColorStop(0,"rgba(255,196,90,.75)");gr.addColorStop(.4,"rgba(255,160,70,.25)");gr.addColorStop(1,"rgba(255,140,60,0)");hx.fillStyle=gr;hx.fillRect(0,0,128,128);
  const glow=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(hc),transparent:true,depthWrite:false}));glow.position.y=1.18;glow.scale.set(2.4,2.4,1);candle.add(glow);
  candle.renderOrder=1;flame.renderOrder=3;glow.renderOrder=2;

  /* 飄浮光點 */
  const N=90,sp=new Float32Array(N*3),col=new Float32Array(N*3),spd=new Float32Array(N),sz=new Float32Array(N);
  const pal=[[1,.68,.12],[1,.48,.35],[.42,.55,1],[1,.44,.57],[.13,.7,.55]];
  for(let i=0;i<N;i++){sp[i*3]=Math.random()*2-1;sp[i*3+1]=Math.random()*2-1;sp[i*3+2]=-Math.random()*2;const c=pal[i%pal.length];col.set(c,i*3);spd[i]=.03+Math.random()*.06;sz[i]=.6+Math.random()*1.2}
  const sg=new THREE.BufferGeometry();sg.setAttribute("position",new THREE.BufferAttribute(sp,3));sg.setAttribute("aCol",new THREE.BufferAttribute(col,3));sg.setAttribute("aSpd",new THREE.BufferAttribute(spd,1));sg.setAttribute("aSz",new THREE.BufferAttribute(sz,1));
  const SU={uTime:{value:0},uHW:{value:2},uHH:{value:3},uA:{value:.75},uPR:{value:R.getPixelRatio()}};
  const sparks=new THREE.Points(sg,new THREE.ShaderMaterial({uniforms:SU,transparent:true,depthWrite:false,
    vertexShader:`uniform float uTime,uHW,uHH,uPR;attribute vec3 aCol;attribute float aSpd,aSz;varying vec3 vC;varying float vF;
    void main(){vC=aCol;float y=mod(position.y+1.+uTime*aSpd,2.)-1.;float x=position.x+sin(uTime*.5+position.y*9.)*.04;
      vF=smoothstep(1.,.75,abs(y));vec4 mv=modelViewMatrix*vec4(x*uHW*1.1,y*uHH*1.15,position.z,1.);gl_PointSize=aSz*9.*uPR;gl_Position=projectionMatrix*mv;}`,
    fragmentShader:`uniform float uA;varying vec3 vC;varying float vF;void main(){vec2 q=gl_PointCoord-.5;float d=length(q);float a=smoothstep(.5,.1,d)+smoothstep(.06,0.,min(abs(q.x),abs(q.y)))*smoothstep(.5,.2,d)*.6;gl_FragColor=vec4(vC,clamp(a,0.,1.)*uA*vF);}`}));
  scene.add(sparks);

  /* 153 盞燈（進度頁） */
  const LP=new Float32Array(TOTAL*3),LON=new Float32Array(TOTAL),LIN=new Float32Array(TOTAL);
  for(let i=0;i<TOTAL;i++){const a=i*.41;const r=.35+(TOTAL-1-i)*.0115;LP[i*3]=Math.cos(a)*r;LP[i*3+1]=-1.9+i*.025;LP[i*3+2]=Math.sin(a)*r;LIN[i]=INTRO.includes(i+1)?1:0}
  const lg=new THREE.BufferGeometry();lg.setAttribute("position",new THREE.BufferAttribute(LP,3));lg.setAttribute("aOn",new THREE.BufferAttribute(LON,1));lg.setAttribute("aIntro",new THREE.BufferAttribute(LIN,1));
  const LU={uTime:{value:0},uA:{value:0},uPR:{value:R.getPixelRatio()},uS:{value:1}};
  const lamps=new THREE.Points(lg,new THREE.ShaderMaterial({uniforms:LU,transparent:true,depthWrite:false,
    vertexShader:`uniform float uTime,uPR,uS;attribute float aOn,aIntro;varying float vOn,vIn;void main(){vOn=aOn;vIn=aIntro;vec4 mv=modelViewMatrix*vec4(position,1.);float s=aOn>.5?(15.+3.*sin(uTime*2.+position.y*7.)):(aIntro>.5?9.:7.);gl_PointSize=s*uPR*uS;gl_Position=projectionMatrix*mv;}`,
    fragmentShader:`uniform float uA;varying float vOn,vIn;void main(){float d=length(gl_PointCoord-.5);float a=smoothstep(.5,.0,d);vec3 c=vOn>.5?vec3(1.,.66,.1):(vIn>.5?vec3(1.,.55,.45):vec3(.55,.5,.82));float k=vOn>.5?1.:.55;gl_FragColor=vec4(c,a*k*uA);}`}));
  const line=new THREE.Line(lg,new THREE.LineBasicMaterial({color:0x8c84b8,transparent:true,opacity:0}));
  const lampG=new THREE.Group();lampG.add(line);lampG.add(lamps);scene.add(lampG);

  /* 版面定位：用螢幕比例放蠟燭與燈 */
  let mode="orb",bre={ph:null,t0:0,dur:1,from:0},flick=1,targetFlick=1,breath=0;
  const cur={x:0,y:0,s:1,la:0,ca:1,ls:1};
  function halfs(){const hh=Math.tan(THREE.MathUtils.degToRad(cam.fov/2))*cam.position.z;return [hh*cam.aspect,hh]}
  function target(){const [hw,hh]=halfs();const W=innerWidth,H=innerHeight;const toX=sx=>(sx*2-1)*hw,toY=sy=>(1-sy*2)*hh;
    const col=Math.min(560,W);const sxr=(W/2+col*.27)/W;
    if(mode==="session"){const s=Math.min((.30*2*hh)/2.6,(.5*2*hw)/1.6);return {x:0,y:toY(.36),s,la:0,ca:1}}
    if(mode==="none"){const s=(.22*2*hh)/2.2;return {x:toX(sxr)+hw*3,y:toY(.2),s,la:0,ca:0}}
    if(mode==="lamps"){const ls=Math.min(.3*2*hh/3.8,.72*2*hw/4.6);return {x:toX(sxr)+hw*3,y:toY(.12),s:.5,la:1,ca:0,lx:0,ly:toY(.22),ls}}
    const s=(.22*2*hh)/2.2;const scroll=(scrollY||0)/H*2*hh;return {x:toX(sxr),y:toY(.2)+scroll,s,la:0,ca:1}}
  function size(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();const [hw,hh]=halfs();SU.uHW.value=hw;SU.uHH.value=hh}
  addEventListener("resize",size);size();
  api.setMode=m=>{mode=m};
  api.setLamps=h=>{for(let i=0;i<TOTAL;i++)LON[i]=h[i+1]?1:0;lg.attributes.aOn.needsUpdate=true};
  api.breathe=(ph,dur)=>{bre={ph,t0:performance.now(),dur:dur||1,from:breath}};
  api.flicker=v=>{targetFlick=v};
  let last=performance.now(),time=0,hidden=false;document.addEventListener("visibilitychange",()=>{hidden=document.hidden;if(!hidden)last=performance.now()});
  const T=target();candle.position.set(T.x,T.y,0);candle.scale.setScalar(T.s);
  function loop(now){requestAnimationFrame(loop);if(hidden)return;const dt=Math.min(.05,(now-last)/1000);last=now;if(!reduce)time+=dt;
    FU.uTime.value=time;SU.uTime.value=time;LU.uTime.value=time;
    flick+=(targetFlick-flick)*Math.min(1,dt*1.5);FU.uFlick.value=flick;
    if(bre.ph){const k=Math.min(1,(now-bre.t0)/bre.dur);const e=.5-.5*Math.cos(Math.PI*k);breath=bre.ph==="in"?bre.from+(1-bre.from)*e:bre.from*(1-e)}else breath+=(0-breath)*Math.min(1,dt*2);
    const tg=target();const L=Math.min(1,dt*3);
    cur.x+=(tg.x-cur.x)*L;cur.s+=(tg.s-cur.s)*L;cur.y=mode==="orb"&&Math.abs(tg.y-cur.y)<.6?tg.y:cur.y+(tg.y-cur.y)*L;
    candle.position.set(cur.x,cur.y,0);candle.scale.setScalar(cur.s);
    candle.rotation.y=reduce?0:Math.sin(time*.4)*.25;
    const fl=1+(reduce?0:.05*Math.sin(time*13)*flick)+breath*.25;flame.scale.set(1+breath*.12,fl,1);
    glow.material.opacity=(mode==="session"?.95:.7)*(1+breath*.3);glow.scale.setScalar(2.4*(1+breath*.35));
    LU.uA.value+=(tg.la-LU.uA.value)*L;line.material.opacity=LU.uA.value*.35;
    if(tg.ls){LU.uS.value=Math.max(.6,tg.ls*1.6);lampG.scale.setScalar(tg.ls);lampG.position.set(tg.lx,tg.ly,0)}
    lampG.rotation.y+=reduce?0:dt*.15;lampG.rotation.x=.28;
    const wantA=mode==="session"?1:0;clearA+=(wantA-clearA)*Math.min(1,dt*2);R.setClearColor(NIGHT,clearA);
    SU.uA.value=mode==="session"?.35:.75;
    R.render(scene,cam)}
  requestAnimationFrame(loop);
  return api;
})();

/* ================= 啟動 ================= */
function onHash(){const h=(location.hash||"").slice(1);route=TABS.some(t=>t[0]===h)||SUBS.includes(h)?h:"today";render();scrollTo(0,0)}
addEventListener("hashchange",onHash);
onHash();
askPersist();
if("serviceWorker" in navigator&&location.protocol==="https:"){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
