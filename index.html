<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>無風燭</title>
<meta name="description" content="廣論奢摩他個人練習：每週聽止觀初探、每天語音引導上座、檢核與進度追蹤。">
<meta name="theme-color" content="#ece6ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="無風燭">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=Outfit:wght@300;500;700&display=swap">
<style>
/* Layout: one-column phone app over a fixed WebGL scene (a little 3D candle + drifting sparkles); bottom tab bar; dialogue strips with two characters; session overlay turns to night. Palette: dawn sky (lavender → apricot), plum ink, saffron/coral/mint accents. */
:root{
  --bg1:#ece6ff;
  --bg2:#ffe6d2;
  --ink:#2b2350;
  --mute:#6c6490;
  --faint:#a39cc0;
  --gold:#ffad1f;
  --coral:#ff7a59;
  --jade:#22b48d;
  --sky:#6c8cff;
  --rose:#ff6f91;
  --paper:#fffaf6;
  --card:rgba(255,255,255,.74);
  --card-2:rgba(255,255,255,.94);
  --line:rgba(43,35,80,.12);
  --night:#16123a;
  --moon:#f4eedf;
  --f-display:"LXGW WenKai TC","Noto Serif TC","PingFang TC",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-num:"Outfit","Noto Sans TC",system-ui,sans-serif;
  --r:22px;
  --shadow:0 8px 28px rgba(43,35,80,.09);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg1)}
html,body{margin:0;color:var(--ink)}
body{background:linear-gradient(175deg,var(--bg1) 0%,#f6e8f6 45%,var(--bg2) 100%) fixed;font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh}
img{max-width:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg1)}
#gl{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block;pointer-events:none}
#app{position:relative;z-index:1;max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(100px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:700;text-wrap:balance;margin:0}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--coral)}
:focus-visible{outline:2.5px solid var(--sky);outline-offset:2px;border-radius:8px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

.hero{min-height:36vh;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;padding-top:max(24px,env(safe-area-inset-top,0px));padding-bottom:10px;padding-right:34%}
.hero.wide{padding-right:0;min-height:26vh}
.hero .date{font-family:var(--f-num);letter-spacing:.12em;font-size:12px;color:var(--mute);text-transform:uppercase}
.hero h1{font-size:32px;line-height:1.18}
.hero .sub{color:var(--mute);font-size:14px}
.stagepill{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;margin-top:6px;padding:5px 12px 5px 5px;border-radius:999px;background:var(--card-2);box-shadow:var(--shadow);font-size:13px;font-weight:500;white-space:nowrap}
.stagepill b{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--gold);color:var(--ink);font-family:var(--f-num);font-size:12px}

.section{display:flex;flex-direction:column;gap:12px;margin-top:22px}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--mute);font-weight:500}
.card{background:var(--card);border:1px solid rgba(255,255,255,.8);border-radius:var(--r);padding:16px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;flex-direction:column;gap:10px;min-width:0;box-shadow:var(--shadow)}
.card.hot{background:linear-gradient(150deg,rgba(255,214,140,.55),rgba(255,255,255,.85) 60%);border-color:rgba(255,173,31,.5)}
.card.calm{border-color:rgba(34,180,141,.35)}
.card.warn{border-color:rgba(255,111,145,.45)}
.card h3{font-size:19px}
.card .meta{color:var(--mute);font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.task{display:grid;grid-template-columns:46px 1fr;gap:12px;align-items:start}
.check{width:46px;height:46px;border-radius:16px;border:2px dashed var(--faint);display:grid;place-items:center;font-size:20px;color:var(--faint);background:rgba(255,255,255,.6)}
.check.on{background:var(--jade);border:2px solid var(--jade);color:#fff;transform:rotate(-4deg)}
.check.half{border-color:var(--gold);color:var(--gold)}
.task .t{font-weight:700;font-size:16px}
.task .d{color:var(--mute);font-size:13px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1.5px solid var(--line);background:var(--card-2);border-radius:999px;padding:9px 16px;font-size:14px;line-height:1.2;transition:transform .15s ease,box-shadow .2s;text-decoration:none;color:var(--ink);display:inline-block}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--gold);border-color:var(--gold);font-weight:700;box-shadow:0 4px 0 #e08e00}
.btn.primary:active{box-shadow:0 1px 0 #e08e00;transform:translateY(3px)}
.btn.ghost{background:transparent}
.btn.small{padding:6px 12px;font-size:13px}
.btn[disabled]{opacity:.4}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;background:rgba(43,35,80,.06);color:var(--mute);white-space:nowrap;font-weight:500}
.tag.gold{background:rgba(255,173,31,.2);color:#9a5d00}
.tag.jade{background:rgba(34,180,141,.16);color:#0f7a5e}
.lect{display:flex;flex-direction:column;gap:4px}
.lect .n{font-family:var(--f-num);color:var(--coral);font-size:13px;letter-spacing:.06em;font-weight:500}
.lect .title{font-family:var(--f-display);font-size:21px;line-height:1.3}
.bar{height:7px;border-radius:99px;background:rgba(43,35,80,.08);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--coral),var(--gold));border-radius:99px}
.mini-note{font-size:13px;color:var(--mute)}
.tip{border-left:3px solid var(--gold);padding-left:10px;font-size:14px}
.quote{font-family:var(--f-display);font-size:16px}
.quote small{display:block;color:var(--mute);font-family:var(--f-body);font-size:12px;margin-top:2px}

/* 角色對話 */
.talk{display:flex;flex-direction:column;gap:10px}
.say{display:grid;grid-template-columns:62px minmax(0,1fr);gap:8px;align-items:end}
.say.r{grid-template-columns:minmax(0,1fr) 62px}
.say.r .ava{order:2}
.ava{width:62px;height:62px;display:block;position:relative}
.ava img,.ava svg{width:62px;height:62px;display:block;object-fit:contain;filter:drop-shadow(0 4px 6px rgba(43,35,80,.15))}
.ava .nm{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);font-size:10px;line-height:1.5;background:var(--ink);color:#fff;border-radius:999px;padding:0 7px;white-space:nowrap}
.bubble{position:relative;background:var(--card-2);border-radius:18px 18px 18px 6px;padding:10px 13px;font-size:14.5px;box-shadow:var(--shadow);min-width:0}
.say.r .bubble{border-radius:18px 18px 6px 18px;background:#fff1dd}
.bubble b{font-family:var(--f-display);font-size:16px;display:block;margin-bottom:2px}
.talk .btns{padding-left:70px}
.pop{animation:pop .4s cubic-bezier(.3,1.6,.6,1) both}
.pop:nth-child(2){animation-delay:.12s}.pop:nth-child(3){animation-delay:.24s}.pop:nth-child(4){animation-delay:.36s}
@keyframes pop{from{transform:translateY(6px) scale(.92);opacity:.3}to{transform:none;opacity:1}}

/* 聽講播放列 */
.lplayer{--pl-bg:rgba(255,255,255,.94);--pl-ink:var(--ink);--pl-sub:var(--mute);--pl-acc:var(--gold);--pl-acc-ink:var(--ink);--pl-chip:rgba(43,35,80,.07);--pl-line:rgba(255,255,255,.9)}
body[data-theme="lotus"] .lplayer{--pl-bg:#fff0f4;--pl-acc:#ff8fab;--pl-chip:rgba(255,143,171,.16);--pl-line:#ffd3df}
body[data-theme="ocean"] .lplayer{--pl-bg:#e9faf6;--pl-acc:#2bb3e6;--pl-acc-ink:#fff;--pl-chip:rgba(43,179,230,.14);--pl-line:#c4efe4}
body[data-theme="forest"] .lplayer{--pl-bg:#fff2e4;--pl-acc:#e8743b;--pl-acc-ink:#fff;--pl-chip:rgba(232,116,59,.14);--pl-line:#ffd9b8}
body[data-theme="elephant"] .lplayer{--pl-bg:#eef3ff;--pl-acc:#6c8cff;--pl-acc-ink:#fff;--pl-chip:rgba(108,140,255,.14);--pl-line:#d3ddff}
body[data-theme="moon"] .lplayer{--pl-bg:#221d52;--pl-ink:#f4eedf;--pl-sub:rgba(244,238,223,.65);--pl-acc:#ffd36b;--pl-chip:rgba(255,255,255,.1);--pl-line:rgba(255,211,107,.35)}
.lplayer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:6;width:min(536px,calc(100% - 24px));background:var(--pl-bg);color:var(--pl-ink);border:1.5px solid var(--pl-line);border-radius:24px;padding:10px 14px;box-shadow:0 12px 30px rgba(43,35,80,.18);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:flex;flex-direction:column;gap:4px}
.lp-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lp-t{display:flex;gap:8px;align-items:baseline;min-width:0}
.lp-n{color:var(--pl-acc);font-size:12px;font-weight:700;white-space:nowrap;filter:saturate(1.2) brightness(.85)}
body[data-theme="moon"] .lp-n{filter:none}
.lp-title{font-family:var(--f-display);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lp-x{background:none;border:0;color:var(--pl-sub);font-size:14px;padding:2px 4px}
#lpSeek{width:100%;accent-color:var(--pl-acc);height:18px;margin:0}
.lp-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.lp-time{font-size:12px;color:var(--pl-sub);white-space:nowrap}
.lp-ctl{display:flex;align-items:center;gap:8px}
.lp-ctl button{width:42px;height:42px;padding:0;border:0;border-radius:50%;display:grid;place-items:center;background:var(--pl-chip);color:var(--pl-ink);font-size:12px;font-weight:700;letter-spacing:-.02em}
.lp-ctl .lp-ico{color:var(--pl-sub)}
.lp-ctl button[aria-pressed="true"]{background:var(--pl-acc);color:var(--pl-acc-ink)}
.lp-ctl .lp-play{background:var(--pl-acc);color:var(--pl-acc-ink);font-size:15px}
.lplayer .btn.primary{background:var(--pl-acc);border-color:var(--pl-acc);color:var(--pl-acc-ink);box-shadow:none}
body.playing .toast{bottom:calc(210px + env(safe-area-inset-bottom,0px))}
body.playing #app{padding-bottom:calc(200px + env(safe-area-inset-bottom,0px))}
body.in-session .lplayer{visibility:hidden}
/* 主題收藏 */
.oilbar{display:flex;align-items:center;gap:12px}
.oil-drop{width:44px;height:44px;flex:none}
.oil-v{font-family:var(--f-num);font-size:30px;font-weight:500;line-height:1}
.themes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.th{border:2px solid transparent;background:rgba(255,255,255,.7);border-radius:18px;padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;min-width:0}
.th .pv{width:100%;height:52px;display:flex;justify-content:center;gap:2px}
.th .pv img,.th .pv svg{width:50px;height:50px;object-fit:contain}
.th small.who{color:var(--ink);font-size:11px}
.th b{font-family:var(--f-display);font-size:15px}
.th small{font-size:11px;color:var(--mute)}
.th.on{border-color:var(--gold);background:#fff}
.th.lock .pv{filter:grayscale(1) opacity(.45)}
.unlock-art{position:relative;height:96px}
.unlock-art .sticker{width:96px;height:96px}
.sheet .panel .unlock-art .sticker.tl{top:0;left:14%;right:auto}
.sheet .panel .unlock-art .sticker.tr{top:0;right:14%}
/* 角色貼圖（像 LINE 主題，疊在卡片邊角） */
.card{position:relative}
.sticker{position:absolute;width:70px;height:70px;pointer-events:none;z-index:2}
.sticker .bob{display:block;width:100%;height:100%;animation:bob 3.2s ease-in-out infinite}
.sticker img,.sticker svg{width:100%;height:100%;display:block;object-fit:contain;filter:drop-shadow(0 5px 6px rgba(43,35,80,.2))}
.sticker.tr{top:-34px;right:-6px;transform:rotate(7deg)}
.sticker.tl{top:-34px;left:-8px;transform:rotate(-8deg)}
.sticker.br{bottom:-20px;right:-8px;transform:rotate(-6deg)}
.sticker .mini{position:absolute;top:4px;right:64px;white-space:nowrap;font-style:normal;font-size:11.5px;font-weight:700;background:#fff;color:var(--ink);border-radius:12px 12px 3px 12px;padding:2px 8px;box-shadow:0 3px 10px rgba(43,35,80,.14);transform:rotate(-7deg)}
.sticker.tl .mini{right:auto;left:64px;border-radius:12px 12px 12px 3px;transform:rotate(8deg)}
.sticker.br .mini{top:auto;bottom:40px}
.card.has-tr,.card.has-tl{margin-top:18px}
.card.has-tr>:nth-child(2){padding-right:58px}
.card.has-tl>:nth-child(2){padding-left:58px}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--card);border:1px solid rgba(255,255,255,.8);border-radius:18px;padding:12px 14px;min-width:0;box-shadow:var(--shadow)}
.stat .v{font-family:var(--f-num);font-size:28px;font-weight:500;line-height:1.1}
.stat .v small{font-size:14px;color:var(--mute);font-weight:300}
.stat .k{font-size:12px;color:var(--mute)}
.lamps-space{height:40vh;display:flex;align-items:flex-end;justify-content:center;padding-top:max(20px,env(safe-area-inset-top,0px))}
.lamps-cap{text-align:center}
.lamps-cap .big{font-family:var(--f-num);font-size:46px;font-weight:300;line-height:1}
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:1fr;gap:4px}
.heat i{aspect-ratio:1;border-radius:5px;background:rgba(43,35,80,.07);max-width:100%}
.heat i.l1{background:rgba(255,173,31,.4)}
.heat i.l2{background:rgba(255,140,40,.75)}
.heat i.l3{background:var(--coral)}
.heat i.lv{background:rgba(34,180,141,.3)}
.heat i.today{outline:2px solid var(--ink)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mute)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.issues{display:flex;flex-direction:column;gap:8px}
.issue{display:grid;grid-template-columns:4.5em 1fr 2.2em;gap:8px;align-items:center;font-size:13px}
.issue .bar{height:9px}
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:2.8em minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line);min-width:0}
.li .no{font-family:var(--f-num);color:var(--mute);font-size:13px}
.li .tt{min-width:0;font-size:14px}
.li .tt .lk{background:none;border:0;padding:0;text-align:left;color:var(--ink);font:inherit;font-size:14px}
.li.done .tt .lk{color:var(--mute)}
.li .tt .lk::before{content:"▶ ";color:var(--coral);font-size:11px}
.dot{width:32px;height:32px;border-radius:50%;border:2px dashed var(--faint);display:grid;place-items:center;font-size:14px;background:transparent;color:var(--faint)}
.dot.on{background:var(--gold);border:2px solid var(--gold);color:var(--ink)}
.seg{display:flex;background:rgba(43,35,80,.06);border-radius:999px;padding:4px;gap:2px}
.seg button{flex:1;border:0;background:transparent;border-radius:999px;padding:8px 6px;font-size:13px;color:var(--mute)}
.seg button.on{background:var(--ink);color:#fff;font-weight:700}
.steps{display:flex;flex-direction:column;gap:6px}
.stp{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-radius:14px;font-size:14px}
.stp b{font-family:var(--f-num);display:grid;place-items:center;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);font-size:12px}
.stp.cur{background:rgba(255,173,31,.18)}
.stp.cur b{background:var(--gold);border-color:var(--gold)}
.stp.past b{background:var(--jade);color:#fff;border-color:var(--jade)}
.stp .m{font-family:var(--f-num);color:var(--mute);font-size:12px}
details{border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;font-weight:700;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:" ＋";color:var(--mute)}
details[open] summary::after{content:" －"}
.faq p{margin-top:6px;font-size:14px}
textarea,input[type=number],input[type=text]{width:100%;background:#fff;border:1.5px solid var(--line);border-radius:14px;color:var(--ink);font:inherit;padding:10px 12px}
textarea{min-height:72px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-size:14px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.cp{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:10px;align-items:center}
.cp .ic{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;background:rgba(43,35,80,.06);font-family:var(--f-num);color:var(--mute)}
.cp.due .ic{background:var(--gold);color:var(--ink)}
.cp.pass .ic{background:var(--jade);color:#fff}
.cp.retry .ic{background:rgba(255,111,145,.2);color:#c2335a}
.checkitem{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;font-size:14px;padding:6px 0}
.checkitem input{width:22px;height:22px;accent-color:var(--coral);margin-top:1px}
.remedy{font-size:13px;color:var(--mute);margin-top:2px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;padding:8px max(12px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
nav.tabs .in{display:flex;gap:4px;max-width:520px;width:100%;background:rgba(255,255,255,.88);border-radius:24px;padding:5px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 30px rgba(43,35,80,.16)}
nav.tabs a{flex:1;text-align:center;text-decoration:none;color:var(--mute);font-size:12px;padding:7px 4px;border-radius:18px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav.tabs a .g{font-family:var(--f-display);font-size:18px;line-height:1.1}
nav.tabs a.on{background:var(--ink);color:#fff}
nav.tabs a .badge{position:absolute;top:4px;right:calc(50% - 22px);width:9px;height:9px;border-radius:50%;background:var(--coral)}

body.in-session #app,body.in-session nav.tabs{visibility:hidden}
body.in-session::before{background:transparent}
.overlay{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;color:var(--moon);padding:calc(18px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));background:linear-gradient(to bottom,rgba(22,18,58,.2),rgba(22,18,58,0) 40%,rgba(22,18,58,.85))}
.overlay .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.overlay .label{font-size:12px;letter-spacing:.14em;color:rgba(244,238,223,.65)}
.overlay .center{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:14px;text-align:center;padding-bottom:12px}
.overlay .step{font-family:var(--f-display);font-size:26px}

/* ================= 衍生計算 ================= */
const heard=(s,n)=>!!s.heard[n];
const heardAll=(s,arr)=>arr.every(n=>s.heard[n]);
const heardCount=()=>Object.keys(S.heard).length;
const introCount=()=>INTRO.filter(n=>S.heard[n]).length;
function queue(){const q=[];INTRO.forEach(n=>{if(!S.heard[n])q.push(n)});for(let n=1;n<=TOTAL;n++) if(!S.heard[n]&&!INTRO.includes(n)) q.push(n);return q}
const day=k=>DAYS[k]||null;
function ensureDay(k){if(!DAYS[k])DAYS[k]={sits:[]};if(!DAYS[k].sits)DAYS[k].sits=[];return DAYS[k]}
const practiced=d=>!!d&&((d.sits&&d.sits.length>0)||d.min);
function lastPractice(){let best=null;for(const k in DAYS) if(practiced(DAYS[k])&&(!best||k>best)) best=k;return best}
function consistency(n=7){let done=0,total=0;const t=today();for(let i=1;i<=n;i++){const k=addDays(t,-i);if(k<S.start)continue;const d=day(k);if(d&&d.leave)continue;total++;if(practiced(d))done++}return {done,total}}
const stage=()=>STAGES[S.stage-1];
const warmLeft=()=>S.warmUntil&&today()<=S.warmUntil?daysBetween(today(),S.warmUntil)+1:0;
function sitMin(){if(warmLeft())return 3;return S.customMin||stage().min}
const weekNo=k=>Math.floor(daysBetween(S.start,k)/7);
function heardInWeek(w){let c=0;for(const n in S.heard){const k=S.heard[n];if(k>=S.start&&weekNo(k)===w)c++}return c}
function canAdvance(){
  if(S.stage>=9) return {ok:false};
  const nx=STAGES[S.stage];const miss=nx.req.filter(n=>!S.heard[n]);
  const c=consistency();const steady=c.total>=4&&c.done>=Math.ceil(c.total*0.7);
  const longEnough=daysBetween(S.stageSince,today())>=7;
  return {ok:!miss.length&&steady&&longEnough&&(!nx.needObj||S.obj),miss,steady,longEnough,needObj:nx.needObj&&!S.obj,next:nx};
}
const snoozed=id=>S.snooze[id]&&today()<S.snooze[id];
function cpStatus(cp){const r=S.cps[cp.id];if(r&&r.passed)return "pass";if(!cp.trig(S))return "wait";if(r&&!r.passed&&daysBetween(r.date,today())<14)return "retry";return "due"}

/* ================= 教練（沒完成怎麼辦） ================= */
function coach(){
  const out=[];const t=today();const d=day(t);
  if(d&&d.leave){out.push({tone:"calm",q:["sleepy","今天身體不太舒服，想休息……"],zm:"gentle",title:"今天請假中",body:"生病、出遠門、太累都可以請假。請假的日子不會算進「練習穩定度」。好好休息。",acts:[["取消請假","unleave"]]});return out}
  const lp=lastPractice();const gap=lp?daysBetween(lp,t):null;
  const wl=warmLeft();
  if(wl){out.push({tone:"calm",q:["happy","我回來了！"],zm:"cheer",title:`回溫中，還有 ${wl} 天`,body:"這幾天座時只有 3 分鐘。重點是重新養成每天坐下來的習慣，回溫完會自動回到原本的座時。",acts:[]})}
  else if(lp&&gap>=4&&!practiced(d)){out.push({tone:"warn",q:["sad","好幾天沒坐了……是不是前功盡棄了？"],zm:"gentle",title:`已經 ${gap-1} 天沒上座了`,body:"中斷很正常，不用補。先「回溫三天」：每天只坐 3 分鐘，聽講進度照常，不會被清掉。",acts:[["開始回溫三天","warm"],["今天先做保底一分鐘","mini"]]})}
  else if(lp&&gap>=2&&!practiced(d)){out.push({tone:"calm",q:["confused","昨天沒坐到……今天要坐兩次補回來嗎？"],zm:"gentle",title:"昨天沒坐到？",body:"不用補兩座。今天照常坐一座就好。真的很忙，就做「保底一分鐘」，也算有練。",acts:[["保底一分鐘","mini"]]})}
  const cps=CPS.filter(cp=>cpStatus(cp)==="due");
  if(cps.length) out.push({tone:"hot",q:["think","檢核？是要考試嗎？"],zm:"happy",title:`檢核點到了：${cps[0].name}`,body:"花兩分鐘勾一勾，看看哪裡需要加強。沒過也沒關係，會告訴你怎麼補。",acts:[["去檢核","go-check"]]});
  const a=canAdvance();
  if(a.ok&&!snoozed("adv")&&!wl) out.push({tone:"hot",q:["happy","最近每天都有坐耶！"],zm:"cheer",title:`可以往第 ${a.next.n} 階「${a.next.name}」了`,body:`最近練習很穩，需要的講次也聽了。下一階座時 ${a.next.min} 分鐘：${a.next.focus}`,acts:[["升一階","advance"],["再穩一週","snooze-adv"]]});
  else if(!wl&&S.stage<9&&a.steady&&a.longEnough&&(a.miss.length||a.needObj)&&!snoozed("adv-info")){
    const parts=[];if(a.miss.length)parts.push(`先聽第 ${a.miss.join("、")} 講`);if(a.needObj)parts.push("到「調整」選定所緣");
    out.push({tone:"calm",q:["think","我可以往上一階了嗎？"],zm:"think",title:"練習很穩，下一階快到了",body:`往第 ${a.next.n} 階「${a.next.name}」之前，還要${parts.join("，再")}。`,acts:[["知道了","snooze-adv-info"]]});
  }
  const c=consistency();
  if(!wl&&S.stage>1&&c.total>=5&&c.done<=2&&daysBetween(S.stageSince,t)>=7&&!snoozed("down")&&!(gap>=4))
    out.push({tone:"warn",q:["sleepy","最近好難坐下來……"],zm:"gentle",title:"最近比較難坐下來",body:`過去 ${c.total} 天坐了 ${c.done} 天。要不要先回到上一階，座時短一點，等穩了再往上？`,acts:[["回到上一階","down"],["先不用","snooze-down"]]});
  const w=weekNo(t);
  if(w>=3&&!snoozed("pace")){
    const last=[w-1,w-2,w-3].map(heardInWeek);const avg=last.reduce((x,y)=>x+y,0)/3;
    if(S.pace>1&&avg<S.pace*0.5) out.push({tone:"calm",q:["confused","聽講一直跟不上……"],zm:"gentle",title:"聽講的速度要不要放慢？",body:`最近三週平均每週聽 ${avg.toFixed(1)} 講，目標是 ${S.pace} 講。放慢一點也很好，穩定比快重要。`,acts:[[`改成每週 ${S.pace-1} 講`,"pace-down"],["維持","snooze-pace"]]});
    else if(S.pace<3&&last.every(x=>x>=S.pace+1)&&c.done>=5) out.push({tone:"calm",q:["happy","我最近聽了好多講！"],zm:"happy",title:"你最近聽得比目標多",body:`連續三週都超過每週 ${S.pace} 講。要不要把目標調高一點？不調也完全可以。`,acts:[[`改成每週 ${S.pace+1} 講`,"pace-up"],["維持","snooze-pace"]]});
  }
  if(w>=1&&!out.length){const lw=heardInWeek(w-1);if(lw<S.pace)out.push({tone:"calm",q:["confused","上週沒聽完，要補嗎？"],zm:"gentle",title:`上週聽了 ${lw}/${S.pace} 講`,body:"不用補。這週照順序接著聽就好，進度表是排隊制，不會因為漏聽而越欠越多。",acts:[]})}
  return out;
}

/* ================= 畫面 ================= */
const app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let route="today";
const TABS=[["today","今","今日"],["progress","燈","進度"],["check","驗","檢核"],["adjust","調","調整"]];
function renderTabs(){
  const due=CPS.some(cp=>cpStatus(cp)==="due");
  document.getElementById("tabs").innerHTML=TABS.map(([id,g,l])=>`<a href="#${id}" class="${route===id?"on":""}" aria-current="${route===id?"page":"false"}"><span class="g">${g}</span>${l}${id==="check"&&due?'<span class="badge" aria-label="有檢核點到了"></span>':""}</a>`).join("");
}
function render(){
  document.body.dataset.theme=curTheme();
  renderTabs();
  if(route==="progress") app.innerHTML=vProgress();
  else if(route==="check") app.innerHTML=vCheck();
  else if(route==="adjust") app.innerHTML=vAdjust();
  else app.innerHTML=vToday();
  Scene.setMode(route==="progress"?"lamps":"orb");
  Scene.setLamps(S.heard);
  if(!S.onboarded&&!document.querySelector(".sheet")) openOnboard();
  else checkUnlock();
}
function lastIssue(){const t=today();for(let i=0;i<5;i++){const d=day(addDays(t,-i));if(d&&d.sits&&d.sits.length){const s=d.sits[d.sits.length-1];const it=(s.i||[]).find(x=>ISSUE_TALK[x]);return it||null}}return null}
function dailyTalk(){const n=daysBetween(S.start,today());const iss=lastIssue();
  if(iss&&n%2===0)return ISSUE_TALK[iss];
  const list=DIALOG[S.stage]||DIALOG[1];return list[n%list.length]}
/* 「今天想一想」卡片上引導者說的一句話 */

function greet(){const h=new Date().getHours();return h<5?"夜深了":h<11?"早安":h<14?"午安":h<18?"午後好":"晚上好"}

    return `<div class="card ${c.tone} has-tr" role="status">${st_}<h3>${esc(c.title)}</h3><p>${esc(c.body)}</p>${c.acts.length?`<div class="btns">${c.acts.map(([l,a],i)=>`<button class="btn ${i===0?"primary":""} small" data-act="${a}">${esc(l)}</button>`).join("")}</div>`:""}</div>`}).join("")}</section>`:""}
  <section class="section" aria-labelledby="h-must">

      <p class="meta">${hw>=S.pace?"本週目標完成了。想多聽一講也可以，不想也沒關係。":"按「在這裡聽」，下面會出現播放列，切換頁面也不會停。"}</p>
      <div class="btns"><button class="btn primary" data-act="listen" data-n="${nextL}">▶ ${(S.lpos||{})[nextL]?"接著聽（"+fmtT(S.lpos[nextL])+"）":"在這裡聽"}</button><button class="btn" data-act="heard" data-n="${nextL}">我聽完了</button></div>
      <p class="mini-note">約 ${Math.round(((window.LECT_AUDIO||{})[nextL]||[0,0])[1]/60)} 分鐘・<a href="${lurl(nextL)}" target="_blank" rel="noopener">看全文（大慈恩網站）</a></p>
      ${q[1]?`<p class="mini-note">下一講：第 ${q[1]} 講・${esc(LECT[q[1]-1])}</p>`:""}

  for(const k in DAYS){const d=DAYS[k];if(practiced(d)&&k.startsWith(ym))mdays++;(d.sits||[]).forEach(s=>{mins+=Number(s.m)||0;sessions++});if(d.min)mins+=1}
  const cells=[];const endK=t;const startK=addDays(endK,-(83+ (6-parseK(endK).getDay())));
  for(let i=0;i<84+(6-parseK(endK).getDay());i++){const k=addDays(startK,i);if(k>endK){cells.push(`<i style="visibility:hidden"></i>`);continue}const d=day(k);let cl="";if(d&&d.leave)cl="lv";else if(d){const n=(d.sits||[]).length;cl=n>=2?"l3":n===1?"l2":d.min?"l1":""}cells.push(`<i class="${cl} ${k===t?"today":""}" title="${k}"></i>`)}

  </section>`;

let toastT;function toast(m){let el=document.querySelector(".toast");if(!el){el=document.createElement("div");el.className="toast";el.setAttribute("role","status");document.body.appendChild(el)}el.textContent=m;clearTimeout(toastT);toastT=setTimeout(()=>el.remove(),2200)}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const a=b.dataset.act;const t=today();
  const go=()=>{persist();render()};
  switch(a){
    case "sit": if(((day(t)||{}).sits||[]).length>=S.sits&&b.classList.contains("check")){toast("今天的上座已完成");break} Session.run("sit");break;
    case "manual": openLog({m:sitMin(),manual:true});break;
    case "mini": Session.run("mini");break;
    case "alert": Session.run("alert");break;
    case "night": Session.run("night");break;
    case "heard": S.heard[b.dataset.n]=t;persist();render();toast(`第 ${b.dataset.n} 講已點亮，燈油 +3`);break;
    case "toggle": {const n=b.dataset.n;if(S.heard[n])delete S.heard[n];else S.heard[n]=t;go();break}
    case "lf": listFilter=b.dataset.v;render();break;
    case "listen": LP.open(Number(b.dataset.n));break;
    case "theme": {const th=THEMES.find(x=>x.id===b.dataset.id);if(th&&unlocked(th)){S.theme=th.id;go();toast(`換上「${th.name}」`)}else if(th)toast(`還差 ${th.cost-oil()} 滴燈油`);break}
    case "leave": ensureDay(t).leave=true;persist(t);render();toast("今天請假，好好休息");break;
    case "unleave": if(DAYS[t])delete DAYS[t].leave;persist(t);render();break;
    case "warm": S.warmUntil=addDays(t,2);go();toast("回溫三天：每天 3 分鐘");break;
    case "advance": case "advance-force": if(S.stage<9){S.stage++;S.stageSince=t;S.customMin=null;go();toast(`進入第 ${S.stage} 階・${stage().name}`)}break;
    case "down": if(S.stage>1){S.stage--;S.stageSince=t;S.customMin=null;go();toast(`回到第 ${S.stage} 階・${stage().name}`)}break;
    case "snooze-adv": S.snooze.adv=addDays(t,7);go();break;
    case "snooze-adv-info": S.snooze["adv-info"]=addDays(t,7);go();break;
    case "snooze-down": S.snooze.down=addDays(t,7);go();break;
    case "snooze-pace": S.snooze.pace=addDays(t,14);go();break;
    case "pace-down": S.pace=Math.max(1,S.pace-1);S.snooze.pace=addDays(t,21);go();break;
    case "pace-up": S.pace=Math.min(3,S.pace+1);S.snooze.pace=addDays(t,21);go();break;
    case "go-check": location.hash="#check";break;
    case "cp-open": openCp=openCp===b.dataset.id?null:b.dataset.id;render();break;
    case "set-pace": S.pace=Number(b.dataset.v);go();break;
    case "set-sits": S.sits=Number(b.dataset.v);go();break;
    case "set-obj": S.obj=b.dataset.v||null;go();break;
    case "set-voice": S.voice=b.dataset.v==="true";go();break;
    case "set-rate": S.rate=Number(b.dataset.v);go();break;
    case "voice-test": Audio_.unlock();Voice.speak(TEST_SAY[0]);break;
    case "export": doExport();break;
    case "import": doImport();break;
    case "reset": doReset();break;
    case "reset-yes": S=blank();DAYS={};persist();render();break;
    case "download": doDownload();break;
    case "upload": document.getElementById("upfile").click();break;
    case "reset-no": document.getElementById("dataArea").innerHTML="";break;
  }
});
function restoreFrom(txt){try{const o=JSON.parse(txt);if(!o.state)throw 0;S=Object.assign(blank(),o.state);DAYS=o.days||{};persist();render();toast("已還原")}catch(e){toast("格式不對，請用本 App 產生的備份")}}
function doDownload(){
  S.lastBackup=today();persist();
  const blob=new Blob([JSON.stringify({app:"無風燭",exported:new Date().toISOString(),state:S,days:DAYS},null,1)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`無風燭備份-${today()}.json`;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);render();toast("備份檔已下載");
}
document.addEventListener("change",e=>{
  if(e.target.id==="upfile"){const f=e.target.files&&e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>restoreFrom(r.result);r.readAsText(f);e.target.value="";return}
  if(e.target.id==="cmin"){const v=parseInt(e.target.value,10);S.customMin=v>0&&v<=60?v:null;persist();toast(S.customMin?`每座 ${S.customMin} 分鐘`:"照階梯建議")}
});
document.addEventListener("submit",e=>{

});
function doExport(){const txt=JSON.stringify({state:S,days:DAYS});const area=document.getElementById("dataArea");

  const hc=document.createElement("canvas");hc.width=hc.height=128;const hx=hc.getContext("2d");const gr=hx.createRadialGradient(64,64,0,64,64,64);
  gr.addColorStop(0,"rgba(255,196,90,.75)");gr.addColorStop(.4,"rgba(255,160,70,.25)");gr.addColorStop(1,"rgba(255,140,60,0)");hx.fillStyle=gr;hx.fillRect(0,0,128,128);
  const glow=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(hc),transparent:true,depthWrite:false}));glow.position.y=1.18;glow.scale.set(2.4,2.4,1);candle.add(glow);
  candle.renderOrder=1;flame.renderOrder=3;glow.renderOrder=2;

  /* 飄浮光點 */
  const N=90,sp=new Float32Array(N*3),col=new Float32Array(N*3),spd=new Float32Array(N),sz=new Float32Array(N);
  const pal=[[1,.68,.12],[1,.48,.35],[.42,.55,1],[1,.44,.57],[.13,.7,.55]];
  for(let i=0;i<N;i++){sp[i*3]=Math.random()*2-1;sp[i*3+1]=Math.random()*2-1;sp[i*3+2]=-Math.random()*2;const c=pal[i%pal.length];col.set(c,i*3);spd[i]=.03+Math.random()*.06;sz[i]=.6+Math.random()*1.2}
  const sg=new THREE.BufferGeometry();sg.setAttribute("position",new THREE.BufferAttribute(sp,3));sg.setAttribute("aCol",new THREE.BufferAttribute(col,3));sg.setAttribute("aSpd",new THREE.BufferAttribute(spd,1));sg.setAttribute("aSz",new THREE.BufferAttribute(sz,1));
  const SU={uTime:{value:0},uHW:{value:2},uHH:{value:3},uA:{value:.75},uPR:{value:R.getPixelRatio()}};
  const sparks=new THREE.Points(sg,new THREE.ShaderMaterial({uniforms:SU,transparent:true,depthWrite:false,
    vertexShader:`uniform float uTime,uHW,uHH,uPR;attribute vec3 aCol;attribute float aSpd,aSz;varying vec3 vC;varying float vF;
    void main(){vC=aCol;float y=mod(position.y+1.+uTime*aSpd,2.)-1.;float x=position.x+sin(uTime*.5+position.y*9.)*.04;
      vF=smoothstep(1.,.75,abs(y));vec4 mv=modelViewMatrix*vec4(x*uHW*1.1,y*uHH*1.15,position.z,1.);gl_PointSize=aSz*9.*uPR;gl_Position=projectionMatrix*mv;}`,
    fragmentShader:`uniform float uA;varying vec3 vC;varying float vF;void main(){vec2 q=gl_PointCoord-.5;float d=length(q);float a=smoothstep(.5,.1,d)+smoothstep(.06,0.,min(abs(q.x),abs(q.y)))*smoothstep(.5,.2,d)*.6;gl_FragColor=vec4(vC,clamp(a,0.,1.)*uA*vF);}`}));
  scene.add(sparks);

  /* 153 盞燈（進度頁） */
  const LP=new Float32Array(TOTAL*3),LON=new Float32Array(TOTAL),LIN=new Float32Array(TOTAL);
  for(let i=0;i<TOTAL;i++){const a=i*.41;const r=.35+(TOTAL-1-i)*.0115;LP[i*3]=Math.cos(a)*r;LP[i*3+1]=-1.9+i*.025;LP[i*3+2]=Math.sin(a)*r;LIN[i]=INTRO.includes(i+1)?1:0}
  const lg=new THREE.BufferGeometry();lg.setAttribute("position",new THREE.BufferAttribute(LP,3));lg.setAttribute("aOn",new THREE.BufferAttribute(LON,1));lg.setAttribute("aIntro",new THREE.BufferAttribute(LIN,1));
  const LU={uTime:{value:0},uA:{value:0},uPR:{value:R.getPixelRatio()},uS:{value:1}};
  const lamps=new THREE.Points(lg,new THREE.ShaderMaterial({uniforms:LU,transparent:true,depthWrite:false,
    vertexShader:`uniform float uTime,uPR,uS;attribute float aOn,aIntro;varying float vOn,vIn;void main(){vOn=aOn;vIn=aIntro;vec4 mv=modelViewMatrix*vec4(position,1.);float s=aOn>.5?(15.+3.*sin(uTime*2.+position.y*7.)):(aIntro>.5?9.:7.);gl_PointSize=s*uPR*uS;gl_Position=projectionMatrix*mv;}`,
    fragmentShader:`uniform float uA;varying float vOn,vIn;void main(){float d=length(gl_PointCoord-.5);float a=smoothstep(.5,.0,d);vec3 c=vOn>.5?vec3(1.,.66,.1):(vIn>.5?vec3(1.,.55,.45):vec3(.55,.5,.82));float k=vOn>.5?1.:.55;gl_FragColor=vec4(c,a*k*uA);}`}));
  const line=new THREE.Line(lg,new THREE.LineBasicMaterial({color:0x8c84b8,transparent:true,opacity:0}));
  const lampG=new THREE.Group();lampG.add(line);lampG.add(lamps);scene.add(lampG);

  /* 版面定位：用螢幕比例放蠟燭與燈 */
  let mode="orb",bre={ph:null,t0:0,dur:1,from:0},flick=1,targetFlick=1,breath=0;
  const cur={x:0,y:0,s:1,la:0,ca:1,ls:1};
  function halfs(){const hh=Math.tan(THREE.MathUtils.degToRad(cam.fov/2))*cam.position.z;return [hh*cam.aspect,hh]}
  function target(){const [hw,hh]=halfs();const W=innerWidth,H=innerHeight;const toX=sx=>(sx*2-1)*hw,toY=sy=>(1-sy*2)*hh;
    const col=Math.min(560,W);const sxr=(W/2+col*.27)/W;
    if(mode==="session"){const s=Math.min((.30*2*hh)/2.6,(.5*2*hw)/1.6);return {x:0,y:toY(.36),s,la:0,ca:1}}
    if(mode==="lamps"){const ls=Math.min(.3*2*hh/3.8,.72*2*hw/4.6);return {x:toX(sxr)+hw*3,y:toY(.12),s:.5,la:1,ca:0,lx:0,ly:toY(.22),ls}}
    const s=(.22*2*hh)/2.2;const scroll=(scrollY||0)/H*2*hh;return {x:toX(sxr),y:toY(.2)+scroll,s,la:0,ca:1}}
  function size(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();const [hw,hh]=halfs();SU.uHW.value=hw;SU.uHH.value=hh}
  addEventListener("resize",size);size();
  api.setMode=m=>{mode=m};
  api.setLamps=h=>{for(let i=0;i<TOTAL;i++)LON[i]=h[i+1]?1:0;lg.attributes.aOn.needsUpdate=true};
  api.breathe=(ph,dur)=>{bre={ph,t0:performance.now(),dur:dur||1,from:breath}};
  api.flicker=v=>{targetFlick=v};
  let last=performance.now(),time=0,hidden=false;document.addEventListener("visibilitychange",()=>{hidden=document.hidden;if(!hidden)last=performance.now()});
  const T=target();candle.position.set(T.x,T.y,0);candle.scale.setScalar(T.s);
  function loop(now){requestAnimationFrame(loop);if(hidden)return;const dt=Math.min(.05,(now-last)/1000);last=now;if(!reduce)time+=dt;
    FU.uTime.value=time;SU.uTime.value=time;LU.uTime.value=time;
    flick+=(targetFlick-flick)*Math.min(1,dt*1.5);FU.uFlick.value=flick;
    if(bre.ph){const k=Math.min(1,(now-bre.t0)/bre.dur);const e=.5-.5*Math.cos(Math.PI*k);breath=bre.ph==="in"?bre.from+(1-bre.from)*e:bre.from*(1-e)}else breath+=(0-breath)*Math.min(1,dt*2);
    const tg=target();const L=Math.min(1,dt*3);
    cur.x+=(tg.x-cur.x)*L;cur.s+=(tg.s-cur.s)*L;cur.y=mode==="orb"&&Math.abs(tg.y-cur.y)<.6?tg.y:cur.y+(tg.y-cur.y)*L;
    candle.position.set(cur.x,cur.y,0);candle.scale.setScalar(cur.s);
    candle.rotation.y=reduce?0:Math.sin(time*.4)*.25;
    const fl=1+(reduce?0:.05*Math.sin(time*13)*flick)+breath*.25;flame.scale.set(1+breath*.12,fl,1);
    glow.material.opacity=(mode==="session"?.95:.7)*(1+breath*.3);glow.scale.setScalar(2.4*(1+breath*.35));
    LU.uA.value+=(tg.la-LU.uA.value)*L;line.material.opacity=LU.uA.value*.35;
    if(tg.ls){LU.uS.value=Math.max(.6,tg.ls*1.6);lampG.scale.setScalar(tg.ls);lampG.position.set(tg.lx,tg.ly,0)}
    lampG.rotation.y+=reduce?0:dt*.15;lampG.rotation.x=.28;
    const wantA=mode==="session"?1:0;clearA+=(wantA-clearA)*Math.min(1,dt*2);R.setClearColor(NIGHT,clearA);
    SU.uA.value=mode==="session"?.35:.75;
    R.render(scene,cam)}
  requestAnimationFrame(loop);
  return api;
})();

/* ================= 啟動 ================= */
function onHash(){const h=(location.hash||"").slice(1);route=TABS.some(t=>t[0]===h)?h:"today";render();scrollTo(0,0)}
addEventListener("hashchange",onHash);
onHash();
askPersist();
if("serviceWorker" in navigator&&location.protocol==="https:"){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
